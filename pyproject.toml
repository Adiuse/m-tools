[project]
name = "m-tools"
version = "0.1.0"
description = "Professional Marketing Workbench - dependency baseline"
requires-python = ">=3.12.16,<3.13"
dependencies = [
  "Django==5.2.19",
  "djangorestframework==3.18.3",
  "psycopg[binary]==3.3.9",
  "pydantic==2.14.4",
  "jsonschema==4.26.0",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "scikit-learn==1.9.1",
  "statsmodels==0.14.5",
  "pandera[pandas]==0.36.0",
  "networkx==3.7",
  "defusedxml==0.7.1",
  "openpyxl==3.1.5",
  "XlsxWriter==3.3.4",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "pypdf==7.1.1",
]

[tool.uv]
package = false
required-version = "==0.13.10"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
