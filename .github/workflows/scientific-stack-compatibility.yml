name: Scientific stack compatibility

on:
  pull_request:
    paths:
      - "docs/marketing-scientific-engine-specification.md"
      - "tests/scientific_stack_smoke.py"
      - ".github/workflows/scientific-stack-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.5.5 pandas==2.3.3 scipy==1.18.1 scikit-learn==1.9.1 statsmodels==0.15.0
      - run: python tests/scientific_stack_smoke.py core

  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.5.5 pandas==2.3.3 scipy==1.18.1 statsmodels==0.15.0 statsforecast==2.1.1
      - run: python tests/scientific_stack_smoke.py forecast

  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.5.5 pandas==2.3.3 scipy==1.18.1 scikit-learn==1.9.1 statsmodels==0.15.0 dowhy==0.14 econml==0.17.1
      - run: python tests/scientific_stack_smoke.py causal

  bayesian:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.5.5 pandas==2.3.3 scipy==1.18.1 pymc-marketing==1.5.0
      - run: python tests/scientific_stack_smoke.py bayesian

  optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.5.5 scipy==1.18.1 SALib==1.6.0 ortools
      - run: python tests/scientific_stack_smoke.py optimization

  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas==2.3.3 polars==2.1.0 duckdb==2.0.1
      - run: python tests/scientific_stack_smoke.py analytics

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.5.5 pandas==2.3.3 scipy==1.18.1 catboost==1.2.10 shap optuna
      - run: python tests/scientific_stack_smoke.py ml

  nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install sentence-transformers bertopic==0.17.4
      - run: python tests/scientific_stack_smoke.py nlp
      - run: python tests/scientific_stack_smoke.py nlp_model

  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.5.5 pandas==2.3.3 scipy==1.18.1 scikit-learn==1.9.1 statsmodels==0.15.0 statsforecast==2.1.1 dowhy==0.14 econml==0.17.1 pymc-marketing==1.5.0 catboost==1.2.10 shap optuna SALib==1.6.0 ortools polars==2.1.0 duckdb==2.0.1 sentence-transformers bertopic==0.17.4
      - run: python -m pip check
      - run: python tests/scientific_stack_smoke.py combined
