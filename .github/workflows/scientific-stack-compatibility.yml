name: Scientific stack compatibility (manual)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'core = web and core science; full = combined optional science + isolated Meridian'
        type: choice
        options:
          - core
          - full
        default: core

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: stack_check
          POSTGRES_PASSWORD: stack_check
          POSTGRES_DB: stack_check
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U stack_check -d stack_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
      - run: python -m pip install uv==0.13.10
      - run: npm install --global pnpm@11.29.0
      - name: Resolve and verify selected baseline
        env:
          STACK_PROFILE: ${{ inputs.profile }}
          MTOOLS_STACK_POSTGRES_DSN: postgresql://stack_check:stack_check@127.0.0.1:${{ job.services.postgres.ports[5432] }}/stack_check
        run: python scripts/verify_stack.py --profile "$STACK_PROFILE"
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-verification
          if-no-files-found: warn
          path: |
            .stack-check/report.json
            uv.lock
            frontend/pnpm-lock.yaml
            deps/locks/*.txt
            deps/meridian/uv.lock
