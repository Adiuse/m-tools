name: Scientific stack compatibility (manual)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'core = web and core science; full = combined optional science + isolated Meridian'
        type: choice
        options:
          - core
          - full
        default: core

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
      - run: python -m pip install uv==0.13.10
      - run: npm install --global pnpm@11.29.0
      - name: Resolve and verify selected baseline
        env:
          STACK_PROFILE: ${{ inputs.profile }}
        run: python scripts/verify_stack.py --profile "$STACK_PROFILE"
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-verification
          if-no-files-found: warn
          path: |
            .stack-check/report.json
            uv.lock
            frontend/pnpm-lock.yaml
            deps/locks/*.txt
            deps/meridian/uv.lock
